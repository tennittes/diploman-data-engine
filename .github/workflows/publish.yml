name: Automated Blogger Publisher

on:
  schedule:
    # Runs hourly at minute 17 (UTC time)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      publish_all:
        description: 'Publish ALL pending posts in queue?'
        type: boolean
        required: false
        default: false
      batch_limit:
        description: 'Number of posts to publish (ignored if publish_all is checked)'
        type: string
        required: false
        default: '5'
      month_folder:
        description: 'Target specific month folder (optional, e.g. oct2026)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Update Ticker Data
        run: python update_ticker.py

      - name: Execute Batch Publishing Script
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          CMD="python publish.py"

          # Handle publish_all explicit check
          if [ "${{ github.event.inputs.publish_all }}" == "true" ]; then
            CMD="$CMD --publish-all"
          else
            # Determine batch limit (use input if available, else default to 5)
            LIMIT="${{ github.event.inputs.batch_limit }}"
            if [ -z "$LIMIT" ]; then
              LIMIT="5"
            fi
            CMD="$CMD --limit $LIMIT"
          fi

          if [ -n "${{ github.event.inputs.month_folder }}" ]; then
            CMD="$CMD --month-folder ${{ github.event.inputs.month_folder }}"
          fi

          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push Queue State Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add ticker.json output/front-page-engine.json budget-analysis.json "**/news-queue.json" "**/social-queue.json"
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: publish batch post state, ticker state, social queue, and layout updates [skip ci]" && git push)

      - name: Run Social Distribution Pipeline
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python distribute_social.py
