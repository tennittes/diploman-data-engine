name: Weekly Report Compiler Engine

on:
  schedule:
    # Runs every Friday at 16:00 UTC (5:00 PM WAT)
    - cron: '0 16 * * 5'
  workflow_dispatch:
    inputs:
      target_week:
        description: 'Target Reporting ISO Week (Mon-Fri 5-Day Cycle)'
        required: false
        default: 'current_iso_week'
        type: choice
        options:
          - 'current_iso_week'
          - 'previous_iso_week'
          - 'ISO Week 1'
          - 'ISO Week 2'
          - 'ISO Week 3'
          - 'ISO Week 4'
          - 'ISO Week 5'

permissions:
  contents: read

jobs:
  compile_weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib b2sdk

      - name: Run Weekly Report Generator (B2 Data Source)
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_WEEKLY_PAGE_ID: ${{ secrets.BLOGGER_WEEKLY_PAGE_ID }}
        run: |
          TARGET_INPUT="${{ github.event.inputs.target_week }}"
          if [ -z "$TARGET_INPUT" ]; then
            TARGET_INPUT="current_iso_week"
          fi
          python compile_weekly.py --week "$TARGET_INPUT"
