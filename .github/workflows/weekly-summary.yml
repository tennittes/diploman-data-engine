name: Weekly Report Compiler Engine

on:
  schedule:
    # Runs every Friday at 16:00 UTC (5:00 PM WAT)
    - cron: '0 16 * * 5'
  workflow_dispatch:
    inputs:
      target_week:
        description: 'Target Reporting Week (Mon-Fri Cycle)'
        required: false
        default: 'Week 41 (OCT 09) [CURRENT]'
        type: choice
        options:
          - 'Week 41 (OCT 09) [CURRENT]'
          - 'Week 40 (OCT 02)'
          - 'Week 39 (SEP 25)'
          - 'Week 38 (SEP 18)'
          - 'Week 37 (SEP 11)'
          - 'Week 36 (SEP 04)'
          - 'Week 35 (AUG 28)'
          - 'Week 34 (AUG 21)'

permissions:
  contents: write

jobs:
  compile_weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib b2sdk

      - name: Run Weekly Report Generator (B2 Data Source)
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_WEEKLY_PAGE_ID: ${{ secrets.BLOGGER_WEEKLY_PAGE_ID }}
        run: |
          TARGET_INPUT="${{ github.event.inputs.target_week }}"
          if [ -z "$TARGET_INPUT" ]; then
            TARGET_INPUT="Week 41 (OCT 09) [CURRENT]"
          fi
          python compile_weekly.py --week "$TARGET_INPUT"
