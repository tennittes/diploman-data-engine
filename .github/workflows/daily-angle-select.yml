name: Daily 25-Angle Selection & Diploman Times Queue

on:
  push:
    paths:
      - "nov2026/master-data.json"
      - "*/master-data.json"
      - "data/*-matches.json"
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily
  workflow_dispatch:
    inputs:
      vertical:
        description: "Vertical key (governancescore | policingintel | footballtally)"
        required: true
        default: "governancescore"
      run_date_utc:
        description: "Optional UTC date override (YYYY-MM-DD); defaults to today UTC"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  extract-select-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve vertical, data source, and UTC run date
        id: run_meta
        run: |
          VERTICAL="${{ github.event.inputs.vertical }}"
          if [ -z "$VERTICAL" ]; then
            if [ -f "config/policing-contract.json" ] && [ ! -f "config/governance-contract.json" ]; then
              VERTICAL="policingintel"
            elif [ -f "data/pl-matches.json" ]; then
              VERTICAL="footballtally"
            else
              VERTICAL="governancescore"
            fi
          fi

          RUN_DATE="${{ github.event.inputs.run_date_utc }}"
          if [ -z "$RUN_DATE" ]; then
            RUN_DATE=$(date -u +%F)
          fi

          MASTER_FILE="nov2026/master-data.json"
          if [ ! -f "$MASTER_FILE" ]; then
            FOUND_MASTER=$(find . -maxdepth 2 -name "master-data.json" | head -n 1)
            if [ -n "$FOUND_MASTER" ]; then
              MASTER_FILE="${FOUND_MASTER#./}"
            fi
          fi

          echo "vertical=$VERTICAL" >> "$GITHUB_OUTPUT"
          echo "run_date_utc=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "master_file=$MASTER_FILE" >> "$GITHUB_OUTPUT"

      - name: 1. Extract daily metrics summary
        run: >
          node scripts/extract_summary_from_master.js
          --vertical "${{ steps.run_meta.outputs.vertical }}"
          --date "${{ steps.run_meta.outputs.run_date_utc }}"
          --master "${{ steps.run_meta.outputs.master_file }}"
          --data-dir "data"
          --out "state/${{ steps.run_meta.outputs.vertical }}/daily_metrics_summary.json"

      - name: 2. Validate incoming daily metrics
        run: >
          node scripts/validate_inputs.js
          --vertical "${{ steps.run_meta.outputs.vertical }}"
          --date "${{ steps.run_meta.outputs.run_date_utc }}"
          --metrics "state/${{ steps.run_meta.outputs.vertical }}/daily_metrics_summary.json"

      - name: 3. Select daily headline angle (25-Angle Matrix)
        run: >
          node scripts/select_angle.js
          --vertical "${{ steps.run_meta.outputs.vertical }}"
          --date "${{ steps.run_meta.outputs.run_date_utc }}"
          --angles "config/angles-25-master.json"
          --metrics "state/${{ steps.run_meta.outputs.vertical }}/daily_metrics_summary.json"
          --history "state/${{ steps.run_meta.outputs.vertical }}/angle_history.json"
          --out "state/${{ steps.run_meta.outputs.vertical }}/latest_selection.json"

      - name: 4. Queue scored brief for Diploman Times (news-queue.json)
        run: >
          node scripts/queue_scored_brief.js
          --vertical "${{ steps.run_meta.outputs.vertical }}"
          --selection "state/${{ steps.run_meta.outputs.vertical }}/latest_selection.json"
          --metrics "state/${{ steps.run_meta.outputs.vertical }}/daily_metrics_summary.json"
          --queue "news-queue.json"

      - name: Commit updated summary, angle state, and news-queue.json
        run: |
          VERTICAL="${{ steps.run_meta.outputs.vertical }}"
          RUN_DATE="${{ steps.run_meta.outputs.run_date_utc }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "state/${VERTICAL}/daily_metrics_summary.json" \
            "state/${VERTICAL}/angle_history.json" \
            "state/${VERTICAL}/latest_selection.json" \
            "news-queue.json"
          if ! git diff --staged --quiet; then
            git commit -m "chore(${VERTICAL}): extract, select angle & queue Diploman Times brief for ${RUN_DATE}"
            git push
          fi
