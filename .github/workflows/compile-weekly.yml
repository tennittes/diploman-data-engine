name: Weekly Report Compiler Engine

on:
  workflow_dispatch:
    inputs:
      reporting_week:
        description: "Select target ISO reporting week"
        required: true
        default: "Week 42"
        type: choice
        options:
          - "Week 40"
          - "Week 41"
          - "Week 42"
          - "Week 43"
          - "Week 44"
          - "Week 45"
      reporting_year:
        description: "ISO week-year (leave blank for current ISO year)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: write

concurrency:
  group: weekly-report-compiler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compile_weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve ISO target week and compile
        env:
          MANUAL_WEEK: ${{ inputs.reporting_week }}
          MANUAL_YEAR: ${{ inputs.reporting_year }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${MANUAL_WEEK:-}" ]; then
            TARGET_WEEK="$MANUAL_WEEK"
          else
            TARGET_WEEK="Week $(date -u +%V)"
          fi
          YEAR_ARGS=()
          if [ -n "${MANUAL_YEAR:-}" ]; then
            YEAR_ARGS=(--year "$MANUAL_YEAR")
          fi
          echo "Compiling target: $TARGET_WEEK ${MANUAL_YEAR:+for ISO year $MANUAL_YEAR}"
          python compile-weekly.py --week "$TARGET_WEEK" "${YEAR_ARGS[@]}"

      - name: Commit and push compiled data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/ week*-data.json
          if git diff --cached --quiet; then
            echo "No compiled changes to commit."
            exit 0
          fi
          git commit -m "auto: compile weekly policy brief artifacts [skip ci]"
          git push origin HEAD:main
