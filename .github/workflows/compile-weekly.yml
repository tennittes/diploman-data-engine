name: Weekly Report Compiler Engine

on:
  workflow_dispatch:
    inputs:
      reporting_week:
        description: "Select Target Reporting Week"
        required: true
        default: "Week 42"
        type: choice
        options:
          - "Week 41"
          - "Week 42"
          - "Week 43"
          - "Week 44"
  schedule:
    - cron: "0 18 * * 5"

jobs:
  compile_weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Weekly Report Generator
        env:
          REPORTING_WEEK: ${{ github.event.inputs.reporting_week }}
        run: |
          python compile-weekly.py --week "$REPORTING_WEEK"

      - name: Commit and Push Compiled Data & Social Drafts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ week*-data.json
          git commit -m "auto: compile telemetry brief artifacts for $REPORTING_WEEK" || echo "No changes to commit"
          git push origin main
