name: Weekly Report Compiler Engine

on:
  workflow_dispatch:
    inputs:
      reporting_week:
        description: "Select Target Reporting Week"
        required: true
        default: "Week 42"
        type: choice
        options:
          - "Week 40"
          - "Week 41"
          - "Week 42"
          - "Week 43"
          - "Week 44"
          - "Week 45"
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: write

jobs:
  compile_weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve ISO Target Week & Run Generator
        env:
          MANUAL_WEEK: ${{ github.event.inputs.reporting_week }}
        run: |
          if [ -n "$MANUAL_WEEK" ]; then
            TARGET_WEEK="$MANUAL_WEEK"
          else
            # Calculate current ISO week automatically for scheduled runs
            ISO_WEEK=$(date +%V)
            TARGET_WEEK="Week $ISO_WEEK"
          fi
          echo "Compiling for: $TARGET_WEEK"
          python compile-weekly.py --week "$TARGET_WEEK"

      - name: Commit and Push Compiled Data & Social Drafts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ week*-data.json || true
          git commit -m "auto: compile weekly policy brief artifacts [skip ci]" || echo "No changes to commit"
          git push origin main
