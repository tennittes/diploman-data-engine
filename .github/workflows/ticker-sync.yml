name: Sync Live Ticker

on:
  schedule:
    - cron: '0 7 * * *' # Runs every day at 7:00 AM UTC
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  sync-ticker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Execute Ticker Generator
        run: python update_ticker.py

      - name: Commit and Push Ticker State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ticker.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update ticker.json from latest telemetry [skip ci]" && git push)
