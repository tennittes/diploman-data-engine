name: Build and Validate Intelligence Pipeline

on:
  push:
    paths:
      - 'oct2026/master-data.json'
      - 'sep2026/master-data.json'
      - 'aug2026/master-data.json'
      - 'build-pipeline.js'
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Build Pipeline
        run: node build-pipeline.js

      - name: Commit and Push Cleaned Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          if git diff --staged --quiet; then
            echo "No changes in compiled outputs to commit."
          else
            git commit -m "auto(build): compile master-data.json into dist outputs [skip ci]"
            git push
          fi
